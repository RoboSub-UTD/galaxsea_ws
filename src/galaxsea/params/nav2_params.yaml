local_costmap:
  local_costmap:
    ros__parameters:
      observation_sources: pointcloud
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1
      robot_radius: 0.22
      plugins: [obstacle_layer, inflation_layer]
      transform_tolerance: 0.5
      always_send_full_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: pointcloud
        pointcloud:
          topic: /pointcloud/filtered
          data_type: PointCloud2
          clearing: true
          marking: true
          observation_persistence: 0.3
          raytrace_max_range: 40.0
          obstacle_max_range: 40.0
          max_obstacle_height: 5.0
          min_obstacle_height: -10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 0.5
      publish_frequency: 0.5
      resolution: 0.05
      robot_radius: 0.22
      width: 1000
      height: 1000
      origin_x: -25.0
      origin_y: -25.0
      track_unknown_space: false
      plugins: [static_layer, obstacle_layer, inflation_layer]
      transform_tolerance: 0.5
      always_send_full_costmap: true
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        map_topic: /map
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: pointcloud
        pointcloud:
          topic: /pointcloud/filtered
          data_type: PointCloud2
          observation_persistence: 0.5
          clearing: true
          marking: true
          sensor_frame: /scan
          raytrace_max_range: 82.0
          obstacle_max_range: 80.0
          max_obstacle_height: 5.0
          min_obstacle_height: -10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.0
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.0
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.6
      yaw_goal_tolerance: 0.35
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 60
      model_dt: 0.1
      batch_size: 1000
      iteration_count: 1
      vx_max: 1.0
      vx_min: -0.5
      wz_max: 0.3
      vy_std: 0.0
      vz_std: 0.05
      ax_max: 0.5
      ax_min: -0.5
      az_max: 0.3
      prune_distance: 1.5
      transform_tolerance: 0.5
      temperature: 0.2
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      velocity_scaling:
        distance_to_goal_threshold: 1.5
        max_velocity_far: 1.0
        max_velocity_near: 0.25
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        cost_weight: 4.0
      GoalCritic:
        cost_weight: 6.0
        threshold_to_consider: 1.5
      GoalAngleCritic:
        cost_weight: 3.0
        threshold_to_consider: 1.0
      PathAlignCritic:
        cost_weight: 6.0
        threshold_to_consider: 1.5
      PathFollowCritic:
        cost_weight: 8.0
      PathAngleCritic:
        cost_weight: 3.0
      PreferForwardCritic:
        cost_weight: 2.0

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: true
      downsampling_factor: 4
      tolerance: 0.25
      allow_unknown: true
      max_iterations: -1
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      minimum_turning_radius: 0.40
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      coarse_search_resolution: 4
      goal_heading_mode: "DEFAULT"
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_only_if_path_becomes_invalid.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"