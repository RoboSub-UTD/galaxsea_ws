slam_toolbox:
  ros__parameters:

    map_start_at_dock: true
    map_update_interval: 1.0
    map_start_pose: [0.0, 0.0, 0.0]

    use_sim_time: true
    slam_mode: mapping

    map_frame: map
    odom_frame: odom
    base_frame: base_link

    scan_topic: /scan

    resolution: 0.05
    min_laser_range: 0.2
    max_laser_range: 80.0

    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1